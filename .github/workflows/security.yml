name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run audit

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: timber
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d timber"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - name: Apply migrations to an empty database
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/timber
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_KEY: ci-only-placeholder
          ALLOWED_ORIGINS: http://localhost:5173
          PORT: "0"
          PGPASSWORD: postgres
        run: |
          ./target/debug/timber-chat-backend >/tmp/timber-backend.log 2>&1 &
          server_pid=$!
          expected_migrations=$(find migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            migration_count=$(psql -h localhost -U postgres -d timber -tAc 'SELECT COUNT(*) FROM _sqlx_migrations' 2>/dev/null || true)
            if [ "$migration_count" = "$expected_migrations" ]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/timber-backend.log
          exit 1
