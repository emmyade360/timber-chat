name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commits:
    name: Commit convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Conventional Commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/lint-commits.mjs "$BASE" "$HEAD"

  release:
    name: Version and release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The bump is derived from the commits since the last tag, so the
          # whole history and every tag has to be present.
          fetch-depth: 0
      - run: node --test scripts/version.test.mjs
      - name: Compute and apply the next version
        id: version
        run: node scripts/version.mjs apply >> "$GITHUB_OUTPUT"
      - name: Commit, tag and push
        if: steps.version.outputs.released == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          BOOTSTRAP: ${{ steps.version.outputs.bootstrap }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$BOOTSTRAP" = "true" ]; then
            # First run: plant the baseline tag on the current commit without
            # inventing a release for history written before this convention.
            git tag -a "$TAG" -m "Baseline $TAG"
            git push origin "$TAG"
            exit 0
          fi
          git add VERSION CHANGELOG.md backend/Cargo.toml backend/Cargo.lock frontend/package.json frontend/package-lock.json
          # [skip ci] stops this commit re-entering the workflow. Render is
          # deliberately NOT skipped: this commit is the one carrying the new
          # version, so it is the one that should be running in production.
          git commit -m "chore(release): $VERSION [skip ci]"
          git tag -a "$TAG" -m "$TAG"
          git push origin HEAD:main --follow-tags
      - name: Publish the GitHub release
        if: steps.version.outputs.released == 'true' && steps.version.outputs.bootstrap == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # The newest section of the changelog is this release's notes.
          awk '/^## /{ n++ } n == 1' CHANGELOG.md > /tmp/notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run audit

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: timber
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d timber"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - name: Apply migrations to an empty database
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/timber
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_KEY: ci-only-placeholder
          ALLOWED_ORIGINS: http://localhost:5173
          PORT: "0"
          PGPASSWORD: postgres
        run: |
          ./target/debug/timber-chat-backend >/tmp/timber-backend.log 2>&1 &
          server_pid=$!
          expected_migrations=$(find migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            migration_count=$(psql -h localhost -U postgres -d timber -tAc 'SELECT COUNT(*) FROM _sqlx_migrations' 2>/dev/null || true)
            if [ "$migration_count" = "$expected_migrations" ]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/timber-backend.log
          exit 1
